<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="歡迎來到今天的課程，一起開啟愉快的學習時光。">
  <title>歡迎上課</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-shape shape-one"></div>
  <div class="background-shape shape-two"></div>
  <div class="doodle doodle-left" aria-hidden="true">✿</div>
  <div class="doodle doodle-right" aria-hidden="true">☀</div>

  <main class="welcome-card">
    <div class="tape" aria-hidden="true"></div>
    <div class="icon" aria-hidden="true">☕</div>
    <p class="eyebrow">READY TO LEARN?</p>
    <h1>歡迎來上課！</h1>
    <p class="subtitle">帶著一點好奇、一點期待，<br class="desktop-break">一起展開今天愉快的學習旅程。</p>

    <div class="class-info">
      <div>
        <span class="label">今天日期</span>
        <strong id="today">載入中…</strong>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div>
        <span class="label">上課狀態</span>
        <strong><span class="status-dot"></span>準備開始</strong>
      </div>
    </div>

    <button id="startButton" type="button">
      <span>開始今天的課程</span>
      <span class="button-arrow" aria-hidden="true">→</span>
    </button>

    <p id="message" class="message" aria-live="polite"></p>
  </main>

  <footer><span aria-hidden="true">♡</span> 保持好奇，享受學習的每一刻。</footer>
  <script src="script.js"></script>
</body>
</html>
